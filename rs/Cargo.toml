
[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
edition = "2021"
name = "napi_lib"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.0.0", features = ["async", "serde"]}
napi-derive = "3.0.0"
reqwest = "0.12.22"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
once_cell = "1.21.3"
tokio = { version = "1", features = ["full"] }
tagid = { version = "0.2", features = ["uuid"] }
chrono = "0.4.41"
futures = "0.3.31"
sled = "0.34.7"
bincode = "1.3.3"
ts-rs = "11.0.1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"

[lints.rust]
dead_code = "allow"